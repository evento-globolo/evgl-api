[package]
name = "evgl-api"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Evento Globolo REST and WebSocket API: OAuth cross-posting, ticketing, and admission."

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws", "macros"] }
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6"
dotenvy = "0.15"
ed25519-dalek = "3"
evgl-domain = { git = "https://github.com/evento-globolo/evgl-libs", rev = "de7e858f9707e32e1950bb645e424ff6308bca6a" }
evgl-interfaces = { git = "https://github.com/evento-globolo/evgl-interfaces.git", rev = "5401334622e9035a1ac08ab4c7f2ebeac6013016" }
evgl-provider-sdk = { git = "https://github.com/evento-globolo/evgl-libs", rev = "de7e858f9707e32e1950bb645e424ff6308bca6a" }
evgl-providers = { git = "https://github.com/evento-globolo/evgl-libs", rev = "de7e858f9707e32e1950bb645e424ff6308bca6a" }
evgl-token-vault = { git = "https://github.com/evento-globolo/evgl-libs", rev = "de7e858f9707e32e1950bb645e424ff6308bca6a" }
futures-util = "0.3"
jsonwebtoken = "11"
rand = "0.10"
sea-orm = { version = "2.0", features = ["macros", "runtime-tokio-rustls", "sqlx-postgres"] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "json", "migrate"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7", features = ["cors", "request-id", "trace", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
