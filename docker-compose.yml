services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: evgl
      POSTGRES_PASSWORD: evgl
      POSTGRES_DB: evgl
    ports: ["5432:5432"]
    volumes: [evgl-postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evgl"]
      interval: 3s
      timeout: 2s
      retries: 20
volumes:
  evgl-postgres:
