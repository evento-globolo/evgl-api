name: Recovery fix webhook IP validation

on:
  push:
    branches:
      - agent/provider-cross-posting
    paths:
      - .github/workflows/recovery-fix-webhook-ipv6.yml

permissions:
  contents: write

concurrency:
  group: evgl-api-recovery-fix-webhook-ipv6
  cancel-in-progress: false

jobs:
  fix-and-validate:
    if: github.repository == 'evento-globolo/evgl-api'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact recovery branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/provider-cross-posting
          fetch-depth: 0
          persist-credentials: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Apply bounded recovery fixes
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              Path('src/main.rs'): [
                  (
                      'tracing::info!(bind = %config.bind, "Evento Globolo API listening");',
                      'tracing::info!(bind = %config.bind, public_url = %config.public_url, "Evento Globolo API listening");',
                  ),
              ],
              Path('src/registry.rs'): [
                  ('Arc::new(CraigslistAdapter::default())', 'Arc::new(CraigslistAdapter)'),
              ],
              Path('src/store.rs'): [
                  (
                      '''impl ConnectionRow {
              pub fn provider_kind(&self) -> Result<ProviderKind, ApiError> {
                  self.provider.parse().map_err(|error: evgl_domain::DomainError| {
                      ApiError::Internal(error.into())
                  })
              }

              pub fn aad(&self) -> String {''',
                      '''impl ConnectionRow {
              pub fn aad(&self) -> String {''',
                  ),
                  (
                      '''Ok(serde_json::from_value(document)
                  .map_err(|error| ApiError::Internal(error.into()))?)''',
                      '''serde_json::from_value(document)
                  .map_err(|error| ApiError::Internal(error.into()))''',
                  ),
              ],
              Path('src/worker.rs'): [
                  (
                      '''    for target in targets {
                  let provider = match ProviderKind::from_str(&target.provider) {''',
                      '''    for target in targets {
                  if target.job_id != job.id {
                      return Err(ApiError::Internal(anyhow::anyhow!(
                          "claimed target {} belongs to job {}, expected {}",
                          target.id,
                          target.job_id,
                          job.id
                      )));
                  }
                  let provider = match ProviderKind::from_str(&target.provider) {''',
                  ),
              ],
          }

          for path, edits in replacements.items():
              text = path.read_text()
              for old, new in edits:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected exactly one bounded match, found {count}')
                  text = text.replace(old, new)
              path.write_text(text)

          oauth = Path('src/oauth.rs')
          text = oauth.read_text()
          old = '''fn validate_webhook_endpoint(endpoint: &url::Url) -> Result<(), ApiError> {
              if endpoint.scheme() != "https" {
                  return Err(ApiError::BadRequest("webhook endpoint must use HTTPS".into()));
              }
              let host = endpoint
                  .host_str()
                  .ok_or_else(|| ApiError::BadRequest("webhook endpoint must include a host".into()))?;
              if host.eq_ignore_ascii_case("localhost") || host.ends_with(".localhost") {
                  return Err(ApiError::BadRequest("webhook endpoint cannot target localhost".into()));
              }
              if let Ok(address) = host.parse::<std::net::IpAddr>() {
                  let blocked = match address {
                      std::net::IpAddr::V4(address) => {
                          address.is_private()
                              || address.is_loopback()
                              || address.is_link_local()
                              || address.is_broadcast()
                              || address.is_documentation()
                              || address.is_unspecified()
                      }
                      std::net::IpAddr::V6(address) => {
                          address.is_loopback()
                              || address.is_unspecified()
                              || address.is_unique_local()
                              || address.is_unicast_link_local()
                      }
                  };
                  if blocked {
                      return Err(ApiError::BadRequest(
                          "webhook endpoint cannot target a private or local address".into(),
                      ));
                  }
              }
              Ok(())
          }'''
          new = '''fn validate_webhook_endpoint(endpoint: &url::Url) -> Result<(), ApiError> {
              fn blocked_ipv4(address: std::net::Ipv4Addr) -> bool {
                  address.is_private()
                      || address.is_loopback()
                      || address.is_link_local()
                      || address.is_broadcast()
                      || address.is_documentation()
                      || address.is_unspecified()
              }

              fn blocked_ipv6(address: std::net::Ipv6Addr) -> bool {
                  address.is_loopback()
                      || address.is_unspecified()
                      || address.is_unique_local()
                      || address.is_unicast_link_local()
                      || address.to_ipv4_mapped().is_some_and(blocked_ipv4)
              }

              if endpoint.scheme() != "https" {
                  return Err(ApiError::BadRequest("webhook endpoint must use HTTPS".into()));
              }

              let blocked = match endpoint
                  .host()
                  .ok_or_else(|| ApiError::BadRequest("webhook endpoint must include a host".into()))?
              {
                  url::Host::Domain(host) => {
                      if host.eq_ignore_ascii_case("localhost") || host.ends_with(".localhost") {
                          return Err(ApiError::BadRequest(
                              "webhook endpoint cannot target localhost".into(),
                          ));
                      }
                      false
                  }
                  url::Host::Ipv4(address) => blocked_ipv4(address),
                  url::Host::Ipv6(address) => blocked_ipv6(address),
              };

              if blocked {
                  return Err(ApiError::BadRequest(
                      "webhook endpoint cannot target a private or local address".into(),
                  ));
              }
              Ok(())
          }'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'{oauth}: expected exactly one validator match, found {count}')
          text = text.replace(old, new)
          text = text.replace(
              '            "https://[::1]/hook",\n',
              '            "https://[::1]/hook",\n            "https://[::]/hook",\n            "https://[fc00::1]/hook",\n            "https://[fe80::1]/hook",\n            "https://[::ffff:127.0.0.1]/hook",\n',
          )
          oauth.write_text(text)

      - name: Format and validate recovered implementation
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-targets --all-features
          git diff --check

      - name: Commit validated fixes and remove one-shot workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/recovery-fix-clippy.yml \
            .github/workflows/recovery-fix-webhook-ipv6.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: harden recovered provider API validation'
          git push origin HEAD:agent/provider-cross-posting
