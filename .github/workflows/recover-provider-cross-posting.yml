name: Recover archived provider-cross-posting source

on:
  push:
    branches:
      - agent/provider-cross-posting
    paths:
      - .github/workflows/recover-provider-cross-posting.yml

permissions:
  contents: write

concurrency:
  group: recover-provider-cross-posting-evgl-api
  cancel-in-progress: false

jobs:
  recover:
    if: github.repository == 'evento-globolo/evgl-api'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out current recovery branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/provider-cross-posting
          fetch-depth: 0
          persist-credentials: true

      - name: Restore and publish the credential-clean product source
        shell: bash
        run: |
          set -euo pipefail
          cat .recovery/provider-cross-posting/part-* | base64 --decode | tar -xzf -

          # The default workflow token may update source but may not update workflow files.
          # Keep current CI here; the connected GitHub app removes this one-shot transport later.
          git checkout HEAD -- .github/workflows/ci.yml

          git diff --check
          if grep -RIE --exclude-dir=.git --exclude-dir=.recovery --exclude='recover-provider-cross-posting.yml' \
            '(ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|lin_api_[A-Za-z0-9]{20,}|cfat_[A-Za-z0-9_-]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC |OPENSSH |DSA |PGP )?PRIVATE KEY-----)' .; then
            echo 'credential-like material found; refusing to publish' >&2
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .env.example Cargo.toml Dockerfile README.md docker-compose.yml migrations src tests
          git commit -m 'Recover provider cross-posting implementation' \
            -m 'Recovered from the credential-clean 55-day ChatGPT work-reconciliation corpus; dancing-dragons excluded.'
          git push origin HEAD:agent/provider-cross-posting
